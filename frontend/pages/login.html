<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <title>LeadFlow | Login</title>

    <!-- Estilos gerais -->
    <link rel="stylesheet" href="../css/global.css" />
    <link rel="stylesheet" href="../css/layout.css" />
    <link rel="stylesheet" href="../css/components.css" />

    <!-- Estilos específicos -->
    <link rel="stylesheet" href="../css/pages/login.css" />
  </head>

  <body class="pagina-login">
    <!-- FUNDO GEOMÉTRICO -->
    <svg
      class="login-fundo-geometrico"
      viewBox="0 0 1536 864"
      preserveAspectRatio="xMidYMid slice"
      xmlns="http://www.w3.org/2000/svg"
      aria-hidden="true"
    >
      <!-- TRIÂNGULOS PREENCHIDOS À ESQUERDA -->
      <polygon points="0,790 310,205 675,864 0,864" fill="#F7E52F" />

      <polygon points="165,864 400,455 640,864" fill="#F6A52D" />

      <!-- TRIÂNGULOS CONTORNADOS À DIREITA -->
      <polygon
        points="940,675 1260,35 1580,675"
        fill="none"
        stroke="#E9A52F"
        stroke-width="5"
      />

      <polygon
        points="1010,625 1260,155 1510,625"
        fill="none"
        stroke="#F0DC32"
        stroke-width="5"
      />

      <polygon
        points="1105,575 1260,275 1415,575"
        fill="none"
        stroke="#E9A52F"
        stroke-width="5"
      />
    </svg>

    <main class="login-container">
      <!-- PAINEL PRINCIPAL -->
      <section class="login-painel" aria-labelledby="tituloLogin">
        <div class="login-conteudo">
          <!-- LOGO FOCUS -->
          <div class="login-marca">
            <img
              src="../assets/images/logo-focus-2.png"
              alt="FOCUS Consultoria"
              class="login-logo-focus"
            />
          </div>

          <!-- IDENTIFICAÇÃO DO SISTEMA -->
          <div class="login-produto">
            <span>LeadFlow</span>
          </div>

          <!-- DESCRIÇÃO -->
          <div class="login-titulo">
            <h1 id="tituloLogin">Login</h1>
            <p>Acesse sua conta para continuar.</p>
          </div>

          <!-- FORMULÁRIO -->
          <form id="formularioLogin" novalidate>
            <div class="campo-formulario">
              <label for="emailLogin">E-mail</label>

              <input
                type="email"
                id="emailLogin"
                name="email"
                placeholder="seuemail@empresa.com"
                autocomplete="username"
                maxlength="254"
                required
              />
            </div>

            <div class="campo-formulario">
              <label for="senhaLogin">Senha</label>

              <div class="campo-senha">
                <input
                  type="password"
                  id="senhaLogin"
                  name="senha"
                  placeholder="Digite sua senha"
                  autocomplete="current-password"
                  required
                />

                <button
                  type="button"
                  id="botaoMostrarSenha"
                  class="botao-mostrar-senha"
                  aria-label="Mostrar senha"
                  aria-pressed="false"
                >
                  Mostrar
                </button>
              </div>
            </div>

            <!-- MENSAGEM DE ERRO -->
            <div
              id="mensagemErro"
              class="mensagem-erro"
              role="alert"
              aria-live="polite"
              hidden
            ></div>

            <!-- MENSAGEM DE SUCESSO -->
            <div
              id="mensagemSucesso"
              class="mensagem-sucesso"
              role="status"
              aria-live="polite"
              hidden
            ></div>

            <!-- BOTÃO DE ENTRADA -->
            <button
              type="submit"
              id="botaoEntrar"
              class="botao-primario botao-login"
            >
              Entrar
            </button>
          </form>

          <!-- RODAPÉ -->
          <div class="login-rodape">
            <p>
              Em caso de problemas de acesso, entre em contato com o
              administrador do sistema.
            </p>
          </div>
        </div>
      </section>
    </main>

    <!-- JAVASCRIPT -->
    <script src="../js/utils/validators.js" defer></script>
    <script src="../js/services/api.js" defer></script>
    <script src="../js/services/auth.js" defer></script>
    <script src="../js/pages/login.js" defer></script>
  </body>
</html>
